services:

  proxy:
    image: traefik:v3.7
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Connect to Docker via read-only socket proxy instead of mounting the socket directly
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
    # Traefik is reachable on both networks: `default` so it can route to the
    # backend, and `proxy` so it can reach socket-proxy.  The proxy
    # network is the ONLY network on which socket-proxy is reachable.
    networks:
      - default
      - proxy

  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Vendored hardened HAProxy template (byte-identical to upstream plus
      # deny rules for container archive/export/logs/top/stats/changes/attach).
      - ./docker-socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    # Only expose the Docker API on the internal Docker network; do NOT publish to the host.
    # Allow only read-only Docker API endpoints required by Traefik's Docker provider:
    #   GET /containers/json, GET /containers/{id}/json, GET /events, GET /version, GET /_ping
    # POST (create/exec/etc.), DELETE, and all mutating operations are blocked.
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Explicitly block all mutating Docker API operations
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SWARM: 0
    # socket-proxy is only attached to the `proxy` network.  No other service
    # (including db, redis, backend) is on that network, so only
    # Traefik can reach the Docker API proxy.
    networks:
      - proxy

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  redis:
    # Optional rate-limit store.  The backend only uses REDIS_URL when
    # the variable is set; if this service is removed and REDIS_URL is
    # unset, the backend silently falls back to per-worker in-memory
    # rate limiting (legacy behavior).
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 3s

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      # REDIS_URL intentionally resolves to empty when unset in .env, so
      # operators can opt out of Redis-backed rate limiting by simply
      # not setting it.  When empty, the backend uses in-memory limits.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # CAPTCHA (Cloudflare Turnstile) -- both keys are optional; when
      # CAPTCHA_ENABLED is unset/false the verification is bypassed.
      # Production deployments that enable CAPTCHA must supply both the
      # public site key (safe to ship to the SPA) and the secret key.
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

volumes:
  app-db-data:

networks:
  # Dedicated network for Traefik <-> socket-proxy only.  socket-proxy is
  # unreachable from the default network and from the host.
  proxy:
